name: failure analyze

on:
  workflow_call:
    inputs:
      result-two:
        description: Result two from e2e
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate timestamp and secret check file
        env:
          TEST_KEY_A: ${{ secrets.TEST_KEY_A }}
          E2E_RESULT_TWO: ${{ inputs.result-two }}
        run: |
          FA_TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          if [ -z "$TEST_KEY_A" ]; then
            FA_SECRET_STATUS="failure analyze key is empty"
          else
            FA_SECRET_STATUS="failure analyze key is not empty"
          fi
          echo "$FA_SECRET_STATUS"
          echo "--- e2e result two (via output) ---" > timestamp-fa.md
          echo "$E2E_RESULT_TWO" >> timestamp-fa.md
          echo "" >> timestamp-fa.md
          echo "failure analyze Timestamp: $FA_TIMESTAMP" >> timestamp-fa.md
          echo "$FA_SECRET_STATUS" >> timestamp-fa.md
          cat timestamp-fa.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: timestamp-artifact-fa
          path: timestamp-fa.md
