name: failure analyze

on:
  workflow_call:
    inputs:
      result-two:
        description: Result two from e2e
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate failure analysis report
        env:
          TEST_KEY_A: ${{ secrets.TEST_KEY_A }}
          E2E_RESULT_TWO: ${{ inputs.result-two }}
          PR_NUMBER: ${{ github.event.pull_request.number || 'unknown' }}
          PR_TITLE: ${{ github.event.pull_request.title || 'untitled' }}
        run: |
          FA_TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          if [ -z "$TEST_KEY_A" ]; then
            FA_SECRET_STATUS="failure analyze key is empty"
          else
            FA_SECRET_STATUS="failure analyze key is not empty"
          fi
          echo "$FA_SECRET_STATUS"
          mkdir -p failure-analysis-report
          REPORT_PATH="failure-analysis-report/failure_report.md"
          echo "--- e2e result two (via output) ---" > "$REPORT_PATH"
          echo "$E2E_RESULT_TWO" >> "$REPORT_PATH"
          echo "" >> "$REPORT_PATH"
          echo "failure analyze Timestamp: $FA_TIMESTAMP" >> "$REPORT_PATH"
          echo "$FA_SECRET_STATUS" >> "$REPORT_PATH"
          echo "" >> "$REPORT_PATH"
          echo "## Pull request" >> "$REPORT_PATH"
          echo "PR number: $PR_NUMBER" >> "$REPORT_PATH"
          echo "PR title: $PR_TITLE" >> "$REPORT_PATH"
          cat "$REPORT_PATH"

      - name: Upload failure analysis report
        uses: actions/upload-artifact@v7
        with:
          name: failure-analysis-report
          path: failure-analysis-report/
          if-no-files-found: error
