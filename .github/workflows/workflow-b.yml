name: Workflow B

on:
  workflow_run:
    workflows: ["Workflow A"]
    types:
      - completed

jobs:
  download:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download artifact from Workflow A
        uses: actions/download-artifact@v4
        with:
          name: timestamp-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: download-artifact

      - name: Rename and re-upload artifact
        run: |
          mv download-artifact/timestamp.md timestamp-from-a.md
          cat timestamp-from-a.md

      - name: Upload renamed artifact
        uses: actions/upload-artifact@v4
        with:
          name: timestamp-artifact-from-a
          path: timestamp-from-a.md
